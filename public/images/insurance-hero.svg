<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17324D" />
      <stop offset="100%" stop-color="#0F2033" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#278C83" />
      <stop offset="100%" stop-color="#1B4945" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" rx="24" fill="url(#navyGrad)" />
  
  <!-- Subtle geometric grid lines -->
  <path d="M0 80H600M0 160H600M0 240H600M0 320H600" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
  <path d="M120 0V400M240 0V400M360 0V400M480 0V400" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Shield of Protection -->
  <g transform="translate(300, 180)">
    <!-- Glow behind shield -->
    <circle r="110" fill="#278C83" fill-opacity="0.12" />
    
    <!-- Outer Shield Frame -->
    <path d="M0 -85C45 -85 80 -60 80 -15C80 50 20 85 0 95C-20 85 -80 50 -80 -15C-80 -60 -45 -85 0 -85Z" 
          fill="#17324D" stroke="#278C83" stroke-width="3.5" />
    
    <!-- Inner Shield Accent -->
    <path d="M0 -72C38 -72 68 -50 68 -12C68 42 16 72 0 80C-16 72 -68 42 -68 -12C-68 -50 -38 -72 0 -72Z" 
          fill="url(#tealGrad)" fill-opacity="0.3" stroke="#C2A27C" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Protected Family & Consultation Iconography -->
    <path d="M-22 8C-22 -4 -12 -14 0 -14C12 -14 22 -4 22 8V24H-22V8Z" fill="#FFFFFF" fill-opacity="0.95" />
    <circle cx="0" cy="-24" r="14" fill="#FFFFFF" fill-opacity="0.95" />
    
    <!-- Checkmark of Verified Policy Guidance -->
    <circle cx="36" cy="30" r="18" fill="#278C83" stroke="#FFFFFF" stroke-width="2.5" />
    <path d="M28 30L33 35L44 24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Descriptive Tagline Badge in graphic -->
  <rect x="180" y="325" width="240" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#278C83" stroke-width="1" />
  <text x="300" y="347" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">
    INSURANCE GUIDANCE &amp; SERVICING
  </text>
</svg>

