<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Polished Section Gradient and Sheen -->
    <linearGradient id="polishedBg" x1="0" y1="0" x2="300" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Leather Section Gradient and Sheen -->
    <linearGradient id="leatherBg" x1="300" y1="0" x2="600" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- Flamed Section Gradient -->
    <linearGradient id="flamedBg" x1="0" y1="200" x2="300" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <!-- Honed Section Gradient -->
    <linearGradient id="honedBg" x1="300" y1="200" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Textures -->
    <pattern id="fleckPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#FFFFFF" fill-opacity="0.3" />
      <circle cx="22" cy="18" r="1.5" fill="#C2A27C" fill-opacity="0.3" />
      <circle cx="15" cy="25" r="0.8" fill="#94A3B8" fill-opacity="0.4" />
    </pattern>

    <pattern id="leatherTexture" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M2 5 Q 8 2, 14 6 T 18 15" stroke="#44403C" stroke-width="1.2" fill="none" />
      <circle cx="6" cy="14" r="1" fill="#78716C" fill-opacity="0.4" />
      <circle cx="15" cy="8" r="1.2" fill="#C2A27C" fill-opacity="0.25" />
    </pattern>

    <pattern id="flamedTexture" width="16" height="16" patternUnits="userSpaceOnUse">
      <polygon points="4,2 8,6 3,7" fill="#6B7280" fill-opacity="0.4" />
      <polygon points="12,9 15,13 10,14" fill="#111827" fill-opacity="0.6" />
      <circle cx="7" cy="12" r="1" fill="#D1D5DB" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base 4 Quadrants -->
  <!-- Top Left: POLISHED -->
  <rect x="0" y="0" width="300" height="200" fill="url(#polishedBg)" />
  <rect x="0" y="0" width="300" height="200" fill="url(#fleckPattern)" />
  <path d="M-30 200 L170 -30 L220 -30 L20 200 Z" fill="#FFFFFF" fill-opacity="0.12" />
  <rect x="16" y="14" width="100" height="26" rx="6" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <text x="66" y="31" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">POLISHED</text>
  <text x="24" y="175" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">High gloss mirror reflection</text>

  <!-- Top Right: LEATHER -->
  <rect x="300" y="0" width="300" height="200" fill="url(#leatherBg)" />
  <rect x="300" y="0" width="300" height="200" fill="url(#leatherTexture)" />
  <rect x="316" y="14" width="100" height="26" rx="6" fill="#1C1917" fill-opacity="0.8" stroke="#57534E" stroke-width="1" />
  <text x="366" y="31" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LEATHER</text>
  <text x="324" y="175" fill="#A8A29E" font-family="system-ui, sans-serif" font-size="10">Tactile matte textured finish</text>

  <!-- Bottom Left: FLAMED -->
  <rect x="0" y="200" width="300" height="200" fill="url(#flamedBg)" />
  <rect x="0" y="200" width="300" height="200" fill="url(#flamedTexture)" />
  <rect x="16" y="214" width="100" height="26" rx="6" fill="#111827" fill-opacity="0.8" stroke="#4B5563" stroke-width="1" />
  <text x="66" y="231" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FLAMED</text>
  <text x="24" y="375" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Rough, non-slip outdoor texture</text>

  <!-- Bottom Right: HONED -->
  <rect x="300" y="200" width="300" height="200" fill="url(#honedBg)" />
  <rect x="300" y="200" width="300" height="200" fill="url(#fleckPattern)" />
  <rect x="316" y="214" width="100" height="26" rx="6" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <text x="366" y="231" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HONED</text>
  <text x="324" y="375" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Smooth satin matte surface</text>

  <!-- Dividing Crosshair Grid -->
  <line x1="300" y1="0" x2="300" y2="400" stroke="#C2A27C" stroke-width="2" stroke-opacity="0.6" />
  <line x1="0" y1="200" x2="600" y2="200" stroke="#C2A27C" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="300" cy="200" r="10" fill="#0F172A" stroke="#C2A27C" stroke-width="2" />
  <circle cx="300" cy="200" r="4" fill="#C2A27C" />

  <!-- Outer Frame -->
  <rect x="1" y="1" width="598" height="398" rx="15" stroke="#334155" stroke-width="1.5" />
</svg>

