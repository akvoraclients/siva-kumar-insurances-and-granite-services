<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brownBase" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#452317" />
      <stop offset="50%" stop-color="#2D150E" />
      <stop offset="100%" stop-color="#190C07" />
    </linearGradient>
    <pattern id="brownMinerals" width="55" height="55" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="15" r="2.2" fill="#C2A27C" fill-opacity="0.45" />
      <circle cx="35" cy="10" r="1.6" fill="#1C1917" fill-opacity="0.6" />
      <circle cx="25" cy="40" r="2.8" fill="#854D0E" fill-opacity="0.4" />
      <circle cx="48" cy="35" r="1.4" fill="#E7E5E4" fill-opacity="0.25" />
      <circle cx="8" cy="45" r="1.8" fill="#A16207" fill-opacity="0.35" />
      <circle cx="42" cy="18" r="1.2" fill="#78350F" fill-opacity="0.5" />
    </pattern>
    <pattern id="feldsparOrbs" width="130" height="130" patternUnits="userSpaceOnUse">
      <ellipse cx="40" cy="40" rx="14" ry="10" fill="#92400E" fill-opacity="0.25" stroke="#C2A27C" stroke-opacity="0.15" stroke-width="1" />
      <ellipse cx="100" cy="90" rx="16" ry="12" fill="#78350F" fill-opacity="0.3" stroke="#B45309" stroke-opacity="0.2" stroke-width="1" />
      <circle cx="30" cy="100" r="2.5" fill="#C2A27C" fill-opacity="0.4" />
    </pattern>
    <radialGradient id="warmSheen" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#C2A27C" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </radialGradient>
  </defs>

  <!-- Slab Background -->
  <rect width="600" height="400" rx="16" fill="url(#brownBase)" />
  <rect width="600" height="400" rx="16" fill="url(#brownMinerals)" />
  <rect width="600" height="400" rx="16" fill="url(#feldsparOrbs)" />
  <rect width="600" height="400" rx="16" fill="url(#warmSheen)" />

  <!-- Polish Sheen Highlight -->
  <path d="M50 450 L450 -50 L530 -50 L130 450 Z" fill="#FFFFFF" fill-opacity="0.05" />

  <!-- Slab Border Frame -->
  <rect x="1" y="1" width="598" height="398" rx="15" stroke="#78350F" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Stone Identification Badge -->
  <g transform="translate(24, 336)">
    <rect width="180" height="40" rx="8" fill="#1C1917" fill-opacity="0.85" stroke="#78350F" stroke-width="1" />
    <circle cx="18" cy="20" r="5" fill="#452317" stroke="#C2A27C" stroke-width="1.5" />
    <text x="32" y="19" fill="#FAFAF9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Brown Granite</text>
    <text x="32" y="31" fill="#C2A27C" font-family="system-ui, sans-serif" font-size="9" font-weight="500">Warm, earthy &amp; mineral rich</text>
  </g>
</svg>

