<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greyBase" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="50%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <pattern id="greySpecks" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1.5" fill="#E5E7EB" fill-opacity="0.35" />
      <circle cx="28" cy="8" r="1.8" fill="#111827" fill-opacity="0.5" />
      <circle cx="20" cy="32" r="1.3" fill="#9CA3AF" fill-opacity="0.4" />
      <circle cx="38" cy="38" r="1.6" fill="#F3F4F6" fill-opacity="0.3" />
      <circle cx="6" cy="36" r="1.1" fill="#1F2937" fill-opacity="0.4" />
      <circle cx="34" cy="20" r="1.4" fill="#D1D5DB" fill-opacity="0.3" />
    </pattern>
    <pattern id="crystallineGrid" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M10 10 L45 35 L80 15 L50 70 Z" stroke="#9CA3AF" stroke-opacity="0.1" stroke-width="1.2" fill="none" />
      <circle cx="45" cy="35" r="2" fill="#E5E7EB" fill-opacity="0.25" />
      <circle cx="80" cy="65" r="1.5" fill="#111827" fill-opacity="0.4" />
    </pattern>
    <radialGradient id="greySheen" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </radialGradient>
  </defs>

  <!-- Slab Background -->
  <rect width="600" height="400" rx="16" fill="url(#greyBase)" />
  <rect width="600" height="400" rx="16" fill="url(#greySpecks)" />
  <rect width="600" height="400" rx="16" fill="url(#crystallineGrid)" />
  <rect width="600" height="400" rx="16" fill="url(#greySheen)" />

  <!-- Polish Sheen Highlight -->
  <path d="M-20 400 L400 -20 L480 -20 L60 400 Z" fill="#FFFFFF" fill-opacity="0.04" />

  <!-- Slab Border Frame -->
  <rect x="1" y="1" width="598" height="398" rx="15" stroke="#6B7280" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Stone Identification Badge -->
  <g transform="translate(24, 336)">
    <rect width="180" height="40" rx="8" fill="#1F2937" fill-opacity="0.85" stroke="#4B5563" stroke-width="1" />
    <circle cx="18" cy="20" r="5" fill="#4B5563" stroke="#D1D5DB" stroke-width="1.5" />
    <text x="32" y="19" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Grey Granite</text>
    <text x="32" y="31" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="9" font-weight="500">Durable, uniform &amp; versatile</text>
  </g>
</svg>

