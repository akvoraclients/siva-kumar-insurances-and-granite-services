<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redBase" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="50%" stop-color="#581C1C" />
      <stop offset="100%" stop-color="#2D0D0D" />
    </linearGradient>
    <pattern id="redMinerals" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="16" r="2.0" fill="#991B1B" fill-opacity="0.4" />
      <circle cx="36" cy="10" r="1.8" fill="#18181B" fill-opacity="0.55" />
      <circle cx="22" cy="38" r="2.2" fill="#FCA5A5" fill-opacity="0.25" />
      <circle cx="44" cy="40" r="1.4" fill="#C2A27C" fill-opacity="0.3" />
      <circle cx="6" cy="42" r="1.2" fill="#000000" fill-opacity="0.45" />
      <circle cx="38" cy="22" r="1.5" fill="#EF4444" fill-opacity="0.25" />
    </pattern>
    <pattern id="redVeins" width="140" height="140" patternUnits="userSpaceOnUse">
      <path d="M10 30 C 50 60, 90 20, 130 80" stroke="#000000" stroke-opacity="0.25" stroke-width="2.5" fill="none" />
      <path d="M20 90 C 70 110, 100 80, 135 125" stroke="#991B1B" stroke-opacity="0.3" stroke-width="2" fill="none" />
      <circle cx="70" cy="50" r="2.8" fill="#18181B" fill-opacity="0.4" />
      <circle cx="110" cy="100" r="2.2" fill="#FECACA" fill-opacity="0.3" />
    </pattern>
    <radialGradient id="redSheen" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </radialGradient>
  </defs>

  <!-- Slab Background -->
  <rect width="600" height="400" rx="16" fill="url(#redBase)" />
  <rect width="600" height="400" rx="16" fill="url(#redMinerals)" />
  <rect width="600" height="400" rx="16" fill="url(#redVeins)" />
  <rect width="600" height="400" rx="16" fill="url(#redSheen)" />

  <!-- Polish Sheen Highlight -->
  <path d="M20 420 L420 -20 L500 -20 L100 420 Z" fill="#FFFFFF" fill-opacity="0.04" />

  <!-- Slab Border Frame -->
  <rect x="1" y="1" width="598" height="398" rx="15" stroke="#991B1B" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Stone Identification Badge -->
  <g transform="translate(24, 336)">
    <rect width="195" height="40" rx="8" fill="#2D0D0D" fill-opacity="0.85" stroke="#991B1B" stroke-width="1" />
    <circle cx="18" cy="20" r="5" fill="#7F1D1D" stroke="#FCA5A5" stroke-width="1.5" />
    <text x="32" y="19" fill="#FEF2F2" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Red &amp; Natural Tones</text>
    <text x="32" y="31" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="9" font-weight="500">Bold, distinctive natural colours</text>
  </g>
</svg>

