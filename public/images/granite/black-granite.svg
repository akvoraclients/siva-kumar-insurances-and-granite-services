<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blackBase" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181B1E" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <radialGradient id="glossSheen" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="blackSpecks" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="14" r="1.2" fill="#E2E8F0" fill-opacity="0.4" />
      <circle cx="38" cy="8" r="1.5" fill="#C2A27C" fill-opacity="0.35" />
      <circle cx="24" cy="36" r="0.8" fill="#FFFFFF" fill-opacity="0.5" />
      <circle cx="44" cy="42" r="1.3" fill="#94A3B8" fill-opacity="0.3" />
      <circle cx="6" cy="40" r="1.0" fill="#CBD5E1" fill-opacity="0.35" />
      <circle cx="32" cy="22" r="1.6" fill="#D4AF37" fill-opacity="0.25" />
      <circle cx="18" cy="4" r="0.7" fill="#F8FAFC" fill-opacity="0.6" />
    </pattern>
    <pattern id="quartzFleck" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M15 25 Q 35 15, 45 35 T 75 25" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.2" fill="none" />
      <path d="M80 85 Q 95 65, 110 90" stroke="#C2A27C" stroke-opacity="0.1" stroke-width="1.5" fill="none" />
      <circle cx="95" cy="45" r="2" fill="#C2A27C" fill-opacity="0.3" />
      <circle cx="20" cy="95" r="2.2" fill="#FFFFFF" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Slab Background -->
  <rect width="600" height="400" rx="16" fill="url(#blackBase)" />
  <rect width="600" height="400" rx="16" fill="url(#blackSpecks)" />
  <rect width="600" height="400" rx="16" fill="url(#quartzFleck)" />
  <rect width="600" height="400" rx="16" fill="url(#glossSheen)" />

  <!-- Diagonal Mirror Gloss Reflection -->
  <path d="M-50 450 L350 -50 L450 -50 L50 450 Z" fill="#FFFFFF" fill-opacity="0.035" />

  <!-- Slab Border Frame -->
  <rect x="1" y="1" width="598" height="398" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Stone Identification Badge -->
  <g transform="translate(24, 336)">
    <rect width="180" height="40" rx="8" fill="#0B0C0E" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="20" r="5" fill="#181B1E" stroke="#C2A27C" stroke-width="1.5" />
    <text x="32" y="19" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Black Granite</text>
    <text x="32" y="31" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" font-weight="500">Deep, dense &amp; reflective</text>
  </g>
</svg>

